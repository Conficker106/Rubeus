name: Build Rubeus

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild .\Rubeus.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:LangVersion=latest

      - name: Find exe
        shell: powershell
        run: Get-ChildItem -Recurse -Filter Rubeus.exe

      - name: Upload Rubeus.exe
        uses: actions/upload-artifact@v4
        with:
          name: Rubeus-dMSA
          path: '**/Rubeus.exe'
