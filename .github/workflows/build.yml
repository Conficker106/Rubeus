name: Build Rubeus

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet
        run: nuget restore Rubeus.sln
      - name: Build Release
        run: msbuild Rubeus.sln /p:Configuration=Release /p:Platform="Any CPU"
      - name: Upload Rubeus.exe
        uses: actions/upload-artifact@v4
        with:
          name: Rubeus-dMSA
          path: '**/bin/Release/Rubeus.exe'
